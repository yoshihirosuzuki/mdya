[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Publish to crates.io as an additional channel during a tagged release. This
# names the reusable workflow .github/workflows/publish-crates-io.yml, which
# publishes via crates.io Trusted Publishing (OIDC, no stored token).
publish-jobs = ["./publish-crates-io"]
# Do not run release CI on pull requests; release.yml is tag-triggered only.
# PR-time build/test gates are handled by .github/workflows/verify.yml
# (workflow_dispatch).
pr-run-mode = "skip"
# Build the publishable packages individually with `cargo build -p mdya`
# instead of `cargo build --workspace`. The workspace contains xtask helpers
# that include_bytes! committed-only fixture inputs (Noto fonts, etc.) and
# would fail a workspace-wide compile on a fresh clone.
precise-builds = true

# Pin third-party GitHub Actions to specific commit SHAs to mitigate
# supply-chain risk. Tracks the latest of each major version that dist 0.32.0
# generates by default. Update both the SHA and the version comment together
# when bumping dist.
[dist.github-action-commits]
"actions/checkout" = "df4cb1c069e1874edd31b4311f1884172cec0e10" # v6.0.3
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1

# System dependencies installed on each runner before the cargo build.
# lance-encoding's build script invokes `protoc` and the GitHub-hosted
# runners do not ship it; dist's package_install step picks these up.
[dist.dependencies.apt]
protobuf-compiler = "*"

[dist.dependencies.homebrew]
protobuf = "*"

[dist.dependencies.chocolatey]
protoc = "*"
