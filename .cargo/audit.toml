# cargo-audit configuration for mdya.
#
# Every entry below is an advisory against a crate that mdya reaches only
# through another dependency and cannot replace on its own. Each group says
# which dependency brings the crate in and when to remove the entries.
#
# A security advisory (a vulnerability or unsoundness) is listed here only
# while no version of the dependency that mdya can use has the fix. Remove it
# as soon as one does. Details: https://rustsec.org/advisories/<ID>.html

[advisories]
ignore = [
    # paste (unmaintained, via lance-bitpacking and lance-index -> nalgebra ->
    # simba). Remove when lance no longer depends on it.
    "RUSTSEC-2024-0436",

    # unsafe-libyaml (unmaintained, via lindera -> serde_yaml_ng; lance uses
    # lindera for full-text search). Remove when lindera no longer depends on it.
    "RUSTSEC-2024-0449",
]
