[package]
name = "xtask-generate-tiny-modernbert"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "generate-tiny-modernbert"
path = "src/main.rs"

[dependencies]
ahash = "0.8"
anyhow = "1"
# Track the root Cargo.toml's `candle-*` pins so this fixture generator
# writes safetensors that mdya can load at the same candle version.
candle-core = { version = "=0.11.0", default-features = false }
candle-nn = { version = "=0.11.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
