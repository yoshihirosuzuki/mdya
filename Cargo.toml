[workspace]
members = ["."]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yoshihirosuzuki/mdya"

[package]
name = "mdya"
version = "0.4.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Local Markdown retrieval primitive (BM25 + on-device vector + MCP)."
keywords = ["markdown", "search", "retrieval", "mcp", "local-first"]
categories = ["command-line-utilities", "text-processing"]
# Keep the published crate to what a `cargo install mdya` consumer needs:
# CI workflows and repo/dev tooling are not used when building from the
# crates.io tarball. `.cargo/` stays in, because the tests read the
# environment variable that `.cargo/config.toml` sets, so that `cargo test` in
# the unpacked tarball builds. `cargo install` ignores a package's local
# configuration unless it installs with `--path`. Check with
# `cargo package --list`.
exclude = [
    "/.github",
    "/clippy.toml",
    "/dist-workspace.toml",
    "/justfile",
    "/rustfmt.toml",
    "/.editorconfig",
    "/.gitattributes",
]

[[bin]]
name = "mdya"
path = "src/main.rs"

[lib]
name = "mdya"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1.92"
# The shared ingest flow processes several documents at once within one task
# (`FuturesUnordered`), because what it borrows (the progress sink) keeps it
# from spawning a task per document, and catches the panics of the futures it
# awaits (`FutureExt::catch_unwind`) so that it can finish the documents in
# process before passing a panic on. Only `std` is needed for those.
futures = { version = "0.3.34", default-features = false, features = ["std"] }
# Pinned exactly: the components will rely on lancedb behaviour checked
# against a specific version, so the version moves only on purpose. Used
# without the `remote` feature (the client for a LanceDB server, which mdya
# does not use). `default-features = false` keeps any feature lancedb adds to
# its defaults off unless it is chosen here.
lancedb = { version = "=0.41.0", default-features = false }
# Only to turn on `embed-ipadic` for the lindera that lance uses for
# full-text search, so that the IPADIC dictionary is built into the binary and
# never downloaded at run time. mdya does not call lindera itself. The
# dictionary is fetched at build time, by lindera-ipadic's build script.
# lindera, lindera-dictionary (which builds and loads the dictionary), and
# lindera-ipadic (which decides which dictionary to fetch) are pinned exactly,
# so that a build without `--locked` does not pick a newer dictionary that may
# tokenize differently from the one an existing full-text search index was
# built with. mdya uses the last two only for this pin. Move all three
# together with the lindera version that lance's tokenizer requires.
lindera = { version = "=3.0.7", default-features = false, features = ["embed-ipadic"] }
lindera-dictionary = { version = "=3.0.7", default-features = false }
lindera-ipadic = { version = "=3.0.7", default-features = false }
# The HTTP client for handing embedding to Ollama. 0.12 rather than the latest
# 0.13, with the same features that lance's namespace client already uses
# (rustls with the ring provider, the operating system's root certificates,
# JSON), so that this adds no crate to the binary. 0.13 would put a second
# copy of reqwest in the binary; the 0.13 in Cargo.lock is only for the build
# script of lindera-ipadic. Move to 0.13 once the reqwest in lancedb's
# dependencies is 0.13.
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync"], default-features = false }
# The components log through the `tracing` macros, and `gateway` sets the
# receiver that writes the logs out. mdya asks for only `std`, not the default
# `attributes` feature (`#[instrument]`). A component that uses
# `#[instrument]` asks for `attributes` here first: it is enabled today only
# because lancedb depends on `tracing` with its default features.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[profile.release]
lto = "thin"
strip = "symbols"
opt-level = 3
codegen-units = 1
# Unwind on panic, so that `gateway` can catch an unexpected failure and
# report it: the CLI will exit with a message asking for a bug report, and the
# MCP server will fail only the tool call that panicked and keep serving.
panic = "unwind"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[lints.clippy]
# In MCP stdio mode, stdout carries the protocol, so only the `gateway` module
# writes to it. `print!` and `println!` are allowed for the whole `gateway`
# module (src/gateway.rs). `std::io::stdout` is in `disallowed-methods`
# (clippy.toml).
print_stdout = "deny"
# The methods listed in clippy.toml: `std::io::stdout` and the `std::env`
# functions that read or set environment variables.
disallowed_methods = "deny"
# An unexpected failure is a panic; every expected failure is an error value.
# Outside tests, `.unwrap()` is not used. `.expect()` and `panic!` are used
# only where the code can say why the call cannot fail: write that reason in
# the message, and acknowledge the call with `#[expect(clippy::expect_used)]`
# or `#[expect(clippy::panic)]` on the enclosing statement or item.
# Tests may use all four: clippy.toml allows the first three in tests, and
# src/lib.rs allows `unimplemented!` in the library's unit tests. A test crate
# under `tests/` needs the same `cfg_attr` at its top to use `unimplemented!`.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"

[dev-dependencies]
# The arrow major version that lancedb 0.41.0 uses. Tests build record batches
# for lancedb with these, so another major version would be a second,
# incompatible copy of the same types.
arrow-array = "58"
arrow-schema = "58"
futures = "0.3.34"
# `io-util` and `net` for the tests that answer HTTP requests in place of a
# server, on a local port.
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt"] }
# For the log receiver test double (src/test_support/log_receiver.rs), which
# records events through a layer on a registry. The default features (`fmt`
# and the formatting around it) are for writing logs out and are not needed.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
