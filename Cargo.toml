[workspace]
members = ["."]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yoshihirosuzuki/mdya"

[package]
name = "mdya"
version = "0.4.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Local Markdown retrieval primitive (BM25 + on-device vector + MCP)."
keywords = ["markdown", "search", "retrieval", "mcp", "local-first"]
categories = ["command-line-utilities", "text-processing"]
# Keep the published crate to what a `cargo install mdya` consumer needs:
# CI workflows and repo/dev tooling are not used when building from the
# crates.io tarball. Check with `cargo package --list`.
exclude = [
    "/.github",
    "/.cargo",
    "/clippy.toml",
    "/dist-workspace.toml",
    "/justfile",
    "/rustfmt.toml",
    "/.editorconfig",
    "/.gitattributes",
]

[[bin]]
name = "mdya"
path = "src/main.rs"

[lib]
name = "mdya"
path = "src/lib.rs"

[dependencies]
# Pinned exactly: the components will rely on lancedb behaviour checked
# against a specific version, so the version moves only on purpose. Used
# without the `remote` feature (the client for a LanceDB server, which mdya
# does not use). `default-features = false` keeps any feature lancedb adds to
# its defaults off unless it is chosen here.
lancedb = { version = "=0.41.0", default-features = false }

[profile.release]
lto = "thin"
strip = "symbols"
opt-level = 3
codegen-units = 1
# Unwind on panic, so that `gateway` can catch an unexpected failure and
# report it: the CLI will exit with a message asking for a bug report, and the
# MCP server will fail only the tool call that panicked and keep serving.
panic = "unwind"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[lints.clippy]
# In MCP stdio mode, stdout carries the protocol, so only the `gateway` module
# writes to it. `print!` and `println!` are allowed for the whole `gateway`
# module (src/gateway.rs). `std::io::stdout` is in `disallowed-methods`
# (clippy.toml).
print_stdout = "deny"
# The methods listed in clippy.toml: `std::io::stdout` and the `std::env`
# functions that read or set environment variables.
disallowed_methods = "deny"
# An unexpected failure is a panic; every expected failure is an error value.
# Outside tests, `.unwrap()` is not used. `.expect()` and `panic!` are used
# only where the code can say why the call cannot fail: write that reason in
# the message, and acknowledge the call with `#[expect(clippy::expect_used)]`
# or `#[expect(clippy::panic)]` on the enclosing statement or item.
# Tests may use all four: clippy.toml allows the first three in tests, and
# src/lib.rs allows `unimplemented!` in the library's unit tests. A test crate
# under `tests/` needs the same `cfg_attr` at its top to use `unimplemented!`.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
