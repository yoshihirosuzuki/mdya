[workspace]
members = ["."]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yoshihirosuzuki/mdya"

[package]
name = "mdya"
version = "0.4.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Local Markdown retrieval primitive (BM25 + on-device vector + MCP)."
keywords = ["markdown", "search", "retrieval", "mcp", "local-first"]
categories = ["command-line-utilities", "text-processing"]
# Keep the published crate to what a `cargo install mdya` consumer needs:
# CI workflows and repo/dev tooling are not used when building from the
# crates.io tarball. `.cargo/` stays in, because the tests read the
# environment variable that `.cargo/config.toml` sets, so that `cargo test` in
# the unpacked tarball builds. `cargo install` ignores a package's local
# configuration unless it installs with `--path`. Check with
# `cargo package --list`.
exclude = [
    "/.github",
    "/clippy.toml",
    "/dist-workspace.toml",
    "/justfile",
    "/rustfmt.toml",
    "/.editorconfig",
    "/.gitattributes",
]

[[bin]]
name = "mdya"
path = "src/main.rs"

[lib]
name = "mdya"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1.92"
# Serves the MCP server over HTTP: accepts the connections and hands the
# requests to rmcp's HTTP service. `axum::serve` keeps accepting after a failed
# accept instead of returning, so one bad connection does not stop the server.
# `tracing` lets it log a failed accept that is not about one connection, such
# as running out of open files, as an error. The default features for JSON,
# forms, queries, the matched path, the original URI, and tower's logging are
# left off, as mdya does not use them.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "tracing"] }
# Runs the embedding models on this PC, on the CPU. Their GPU and vendor math
# library backends are features, all left off. candle-nn and
# candle-transformers ask for candle-core 0.11 themselves, so the build has one
# candle-core, whose tensor type the three share.
candle-core = { version = "0.11.1", default-features = false }
candle-nn = { version = "0.11.1", default-features = false }
candle-transformers = { version = "0.11.1", default-features = false }
# Reads the command line arguments and makes the help. Without the default
# `color`, so that the help it makes has no colors in it; the other default
# features (`std`, `help`, `usage`, `error-context`, `suggestions`) are kept.
# Without `env`: the environment variables are read where the components are
# assembled, not by the argument parser.
clap = { version = "4.6.7", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
# Inflates the deflate data in zip files and the gzip members of tar.gz files,
# and computes the CRC-32 of zip entries. `archive_ingest` reads the zip and tar
# formats itself; this is only for the compression and the checksum. The tar
# reader relies on where the gzip decoder stops at the end of a member, which
# was checked against 1.1.10.
flate2 = "1.1.10"
# The shared ingest flow processes several documents at once within one task
# (`FuturesUnordered`), because what it borrows (the progress sink) keeps it
# from spawning a task per document, and catches the panics of the futures it
# awaits (`FutureExt::catch_unwind`) so that it can finish the documents in
# process before passing a panic on. Only `std` is needed for those.
futures = { version = "0.3.34", default-features = false, features = ["std"] }
# Pinned exactly: the components will rely on lancedb behaviour checked
# against a specific version, so the version moves only on purpose. Used
# without the `remote` feature (the client for a LanceDB server, which mdya
# does not use). `default-features = false` keeps any feature lancedb adds to
# its defaults off unless it is chosen here.
lancedb = { version = "=0.41.0", default-features = false }
# Only to turn on `embed-ipadic` for the lindera that lance uses for
# full-text search, so that the IPADIC dictionary is built into the binary and
# never downloaded at run time. mdya does not call lindera itself. The
# dictionary is fetched at build time, by lindera-ipadic's build script.
# lindera, lindera-dictionary (which builds and loads the dictionary), and
# lindera-ipadic (which decides which dictionary to fetch) are pinned exactly,
# so that a build without `--locked` does not pick a newer dictionary that may
# tokenize differently from the one an existing full-text search index was
# built with. mdya uses the last two only for this pin. Move all three
# together with the lindera version that lance's tokenizer requires.
lindera = { version = "=3.0.7", default-features = false, features = ["embed-ipadic"] }
lindera-dictionary = { version = "=3.0.7", default-features = false }
lindera-ipadic = { version = "=3.0.7", default-features = false }
# Colors the names of the values in the logs and the parts of the pretty log
# format that `gateway` writes itself. The same crate that tracing-subscriber
# colors the rest with.
nu-ansi-term = "0.50.3"
# The HTTP client for fetching models from Hugging Face and for handing
# embedding to Ollama. 0.12 rather than the latest 0.13, with the same
# features that lance's namespace client already uses (rustls with the ring
# provider, the operating system's root certificates, JSON), so that this adds
# no crate to the binary. 0.13 would put a second copy of reqwest in the
# binary; the 0.13 in Cargo.lock is only for the build script of
# lindera-ipadic. Move to 0.13 once the reqwest in lancedb's dependencies is
# 0.13.
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls-native-roots"] }
# The MCP server, over stdio (`server`, which reads and writes any async reader
# and writer) and over HTTP (`transport-streamable-http-server`). Without the
# default `macros`: the tools are defined by hand, so that a tool input that
# does not fit its schema is a tool error naming the input, not a JSON-RPC
# error. Its build script compiles nothing: it only sets git's hooks path to
# `.githooks` in the directory two levels above rmcp's own, when that
# directory holds both `.githooks` and `.git`. mdya's repository has no
# `.githooks`, so the script does nothing even when the dependencies are
# vendored into it.
rmcp = { version = "3.9.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
# The JSON Schema of the MCP tools' results, made from the same types that the
# CLI writes as JSON. rmcp, the MCP library the server uses, depends on
# schemars 1 as well, so the two share one copy.
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The SHA-256 of a document's body, which `index` keeps to tell whether a
# document changed. lancedb's dependencies already build both sha2 0.10 and
# 0.11, so this adds no crate to the build; 0.11 is the latest. Pure Rust: no C
# and no build script. Its inline assembly is only for loongarch64 and RISC-V,
# which none of mdya's release targets are.
sha2 = "0.11.1"
tempfile = "3.27.0"
# Measures the width of the terminal that stderr is, so that the one-line
# progress display fills the line without wrapping. It uses the rustix and
# windows-sys that the build already has, without `unsafe` in mdya.
terminal_size = "0.4.4"
thiserror = "2.0.21"
# Splits texts into the tokens the models on this PC take. Without the default
# features, which bring in C (onig) and C++ (esaxx_fast) code; regular
# expressions come from fancy-regex instead.
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
# `rt-multi-thread`: `gateway` runs the asynchronous work on a runtime with
# several threads, as a component may need more than one thread to keep from
# holding up the others. `time`: the MCP server over stdio waits a limited
# time for what it wrote to reach stdout. The build already enables both
# through other dependencies; mdya asks for them here as it uses them itself.
tokio = { version = "1.54.1", features = ["fs", "io-util", "net", "rt", "rt-multi-thread", "sync", "time"], default-features = false }
# `TaskTracker`, with which the MCP server waits for the tool calls in
# progress before it returns. `rt` brings in only futures-util, which the
# build already has.
tokio-util = { version = "0.7.20", default-features = false, features = ["rt"] }
# The components log through the `tracing` macros, and `gateway` sets the
# receiver that writes the logs out. mdya asks for only `std`, not the default
# `attributes` feature (`#[instrument]`). A component that uses
# `#[instrument]` asks for `attributes` here first: it is enabled today only
# because lancedb depends on `tracing` with its default features.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# For the pretty log format that `gateway` writes itself: a log of the `log`
# crate arrives with `log` as its target and its real target among its values,
# and `NormalizeEvent` gives the real one back, as tracing-subscriber's own
# formats do with its `tracing-log` feature.
tracing-log = { version = "0.2.0", default-features = false }
# Writes the logs out. `fmt` writes them in the three output formats (`json`
# for the JSON one), `ansi` colors them, and `env-filter` picks them by the
# directives of `--log-level` and `RUST_LOG`. With `tracing-log`, setting the
# receiver also sets it as the receiver of the `log` crate, which datafusion,
# lance, reqwest, tokenizers, and other dependencies log through, so that
# their logs are picked and written out in the same way. The log receiver test
# double (src/test_support/log_receiver.rs) uses `registry` as well.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt", "json", "registry", "std", "tracing-log"] }

[target.'cfg(unix)'.dependencies]
# Puts a pipe on the process's stdout (fd 1), so that what the libraries write
# there goes to the logs and not to the user's stdout, without `unsafe` in
# mdya. The build already has rustix, through tempfile and terminal_size;
# `stdio` adds only its functions for the standard streams.
rustix = { version = "1.1.4", features = ["stdio"] }

[target.'cfg(windows)'.dependencies]
# Puts the same pipe on the C runtime's standard output, which the C code in
# the build writes through (`_open_osfhandle` and `_dup2`). The build already
# has libc.
libc = "0.2.186"
# Puts the same pipe on the process's standard output handle, which Rust's
# standard library writes through, and writes mdya's results to a console in
# UTF-16 as the standard library does. The build already has windows-sys
# 0.61.2 with these features.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }

[profile.release]
lto = "thin"
# Strip the debug information but keep the symbols, so that the backtrace that
# mdya writes on an unexpected failure names the functions it went through on
# Linux and macOS. On Windows, rustc does not use this setting. The backtrace
# looks for the names in a `.pdb` file there, which mdya is shipped without;
# even beside the `.pdb` file that the release settings make, it does not name
# mdya's functions.
strip = "debuginfo"
opt-level = 3
codegen-units = 1
# Unwind on panic, so that `gateway` can catch an unexpected failure and
# report it: the CLI exits with a message asking for a bug report; the MCP
# server fails only the tool call that panicked and keeps serving, and stops
# in the same way as the CLI only when a panic outside the tool calls leaves
# it unable to go on.
panic = "unwind"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[lints.clippy]
# In MCP stdio mode, stdout carries the protocol, so only the `gateway` module
# writes to it. `print!` and `println!` are allowed for the whole `gateway`
# module (src/gateway.rs). `std::io::stdout` is in `disallowed-methods`
# (clippy.toml).
print_stdout = "deny"
# The methods listed in clippy.toml: `std::io::stdout` and the `std::env`
# functions that read or set environment variables.
disallowed_methods = "deny"
# An unexpected failure is a panic; every expected failure is an error value.
# Outside tests, `.unwrap()` is not used. `.expect()` and `panic!` are used
# only where the code can say why the call cannot fail: write that reason in
# the message, and acknowledge the call with `#[expect(clippy::expect_used)]`
# or `#[expect(clippy::panic)]` on the enclosing statement or item.
# Tests may use all four: clippy.toml allows the first three in tests, and
# src/lib.rs allows `unimplemented!` in the library's unit tests. A test crate
# under `tests/` needs the same `cfg_attr` at its top to use `unimplemented!`.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"

[dev-dependencies]
# The arrow major version that lancedb 0.41.0 uses. Tests build record batches
# for lancedb with these, so another major version would be a second,
# incompatible copy of the same types.
arrow-array = "58"
arrow-schema = "58"
futures = "0.3.34"
# The tests of the pipe on the process's stdout write to it through the C
# library, as the C code in the build does.
libc = "0.2.186"
# `io-util` and `net` for the tests that answer HTTP requests in place of a
# server, on a local port. `time` for the MCP server's tests that check that
# it is still waiting a while later. `test-util` to start the MCP server with
# its clock paused, so that a wait inside rmcp ends at once.
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "test-util", "time"] }
