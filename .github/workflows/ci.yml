# Lint and test gate for pull requests and pushes to `main`.
#
# Mirrors the fmt / clippy / test part of `just check` so the workspace is
# exercised the same way locally and in CI. `just check` also runs `cargo
# audit`, which has no pull-request trigger at all — it is a scheduled monitor
# in `audit.yml` that reports by opening an issue — so this workflow is
# narrower than the local gate by exactly that step. The release build of the
# distribution binary
# is verified by `release.yml` (cargo-dist tag push trigger, 5 platforms) and
# is intentionally NOT duplicated here per PR — `cargo build --release` from
# cold cache exceeded `timeout-minutes` in early experiments and the per-PR
# verification value is small versus the tag-push release build.
#
# Trigger:
#   - pull_request (default events: opened / synchronize / reopened)
#   - push to `main`
# Pure-`*.md` changes are skipped via `paths-ignore`.
#
# Cross-platform link verification (5-platform native build matrix) lives in
# `verify.yml` and is intentionally workflow_dispatch-only — the manual gate
# is run before a release.
#
# Third-party actions are SHA-pinned, except `dtolnay/rust-toolchain@stable`
# which is a channel ref by design (tracks latest stable Rust), matching
# `verify.yml`.

name: ci

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

# Pull requests group by `refs/pull/N/merge` (unique per PR), so each PR
# cancels only its own earlier in-progress run on a re-push. Pushes to `main`
# share a single `refs/heads/main` group and cancel each other; the latest
# push to `main` is the only one kept running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default; this workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  check:
    name: check (ubuntu-latest)
    runs-on: ubuntu-latest
    # Headroom for the cold-cache compile of the workspace; also acts as a
    # hang guard if a step gets stuck.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `@stable` is a channel ref by design (tracks latest stable Rust),
      # intentionally not SHA-pinned, matching `verify.yml`.
      # `dtolnay/rust-toolchain` uses the `minimal` rustup profile, which does
      # NOT include `rustfmt` or `clippy`; they must be listed explicitly so
      # the fmt-check and clippy steps below succeed.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # `lance-encoding`'s build script invokes `protoc`; the runner does not
      # ship it. `lld` (the LLVM linker) is installed alongside it for the
      # `cargo test --workspace` step: linking the workspace's test binaries
      # (candle + lance + arrow statically linked across many binaries in
      # parallel) intermittently crashed GNU `ld` with SIGBUS on the runner;
      # `ld.lld` links with a far smaller memory/disk footprint. Both come from
      # the OS package manager to keep the dependency surface minimal.
      - name: Install protoc and lld
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler lld

      # `xtask-generate-test-pdfs` embeds Noto Sans CJK JP at compile time via
      # `include_bytes!`. The font (~16 MB) is `.gitignore`d to keep the repo
      # small; the workspace clippy / test steps below need it on disk before
      # they can compile the xtask member. Matches the manual download step
      # documented in `xtask/generate-test-pdfs/fonts/README.md`.
      - name: Download Noto Sans CJK JP font for xtask
        run: |
          curl --proto '=https' --tlsv1.2 -fLsS \
            -o xtask/generate-test-pdfs/fonts/NotoSansCJKjp-Regular.otf \
            https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Link with `lld` (installed above) instead of GNU `ld` — see the
      # install step's comment. Scoped to this step via `RUSTFLAGS` because
      # only the test-binary link hit the limit; `fmt` / `clippy` do not link.
      - name: cargo test --workspace
        run: cargo test --workspace
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
