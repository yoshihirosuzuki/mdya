# Manual cross-platform build + link verification.
#
# Trigger: `workflow_dispatch` ONLY — there is intentionally no `push` /
# `pull_request` trigger.
#
# Each runner builds natively, which sidesteps the `lance-linalg`
# `-march=native` cross-compile breakage. The matrix covers every
# release distribution target so the link check runs everywhere a
# release artifact ships:
#   - ubuntu-latest    : Linux x86_64
#   - ubuntu-22.04-arm : Linux aarch64
#   - windows-latest   : Windows x86_64
#   - macos-latest     : macOS aarch64 (Apple Silicon)
#   - macos-15-intel         : macOS x86_64 (Intel)
# The link check enforces the structural requirement that the binary must
# NOT dynamically link ORT / libtokenizers / libsqlite. Each runner also
# shows the executable's size and runs the tests of how mdya starts with the
# release settings.
# `onig_sys` (C oniguruma, via candle's tokenizers) is statically linked and
# is a known exception, so it is not in the forbidden set.

name: verify

on:
  workflow_dispatch:

jobs:
  build-and-link-check:
    name: build + link check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04-arm, windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v7.0.1

      # `@stable` is a branch of the action; `actions.lock` pins it to a
      # commit, and `gh actions-lock --relock` moves the pin forward. The Rust
      # toolchain itself comes from `rust-toolchain.toml`.
      - uses: dtolnay/rust-toolchain@stable

      # `lance-encoding`'s build script invokes `protoc`; the runners do not
      # ship it. Installed via each OS package manager rather than a
      # third-party action to keep the dependency surface minimal.
      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install protoc -y

      - name: Build release
        run: cargo build --release --verbose

      # The size of the executable as it is distributed, with its symbols
      # kept so that a backtrace names the functions on Linux and macOS.
      - name: Executable size
        shell: bash
        run: ls -l target/release/mdya target/release/mdya.exe 2>/dev/null || true

      # The tests of how mdya starts, with the release settings, on each
      # platform: a backtrace names the functions on Linux and macOS, and the
      # pipe that mdya puts on its stdout takes what Rust and the C runtime
      # write there. `ci.yml` runs the tests on Linux only, and not with the
      # release settings.
      - name: Test how mdya starts, with the release settings
        run: cargo test --release --lib gateway::entry

      - name: Link check (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ldd target/release/mdya | tee deps.txt
          if grep -iE 'onnxruntime|libtokenizers|libsqlite|sqlite3' deps.txt; then
            echo "::error::forbidden dynamic library linked (ORT/libtokenizers/libsqlite)"
            exit 1
          fi
          echo "OK: no ORT / libtokenizers / libsqlite dynamic link"

      - name: Link check (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          otool -L target/release/mdya | tee deps.txt
          if grep -iE 'onnxruntime|libtokenizers|libsqlite|sqlite3' deps.txt; then
            echo "::error::forbidden dynamic library linked (ORT/libtokenizers/libsqlite)"
            exit 1
          fi
          echo "OK: no ORT / libtokenizers / libsqlite dynamic link"

      # dumpbin ships with MSVC but is not on PATH by default. `vswhere`, at
      # the fixed location where the Visual Studio installer puts it, finds the
      # latest Visual Studio with the x64 MSVC tools, and the toolset version
      # in its `Microsoft.VCToolsVersion.default.txt` names the directory that
      # holds dumpbin.
      - name: Link check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${Env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) {
            Write-Error "no Visual Studio with the x64 MSVC tools found"
            exit 1
          }
          $toolset = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt" -Raw).Trim()
          $dumpbin = "$vs\VC\Tools\MSVC\$toolset\bin\HostX64\x64\dumpbin.exe"
          & $dumpbin /dependents target\release\mdya.exe | Tee-Object deps.txt
          if (Select-String -Path deps.txt -Pattern 'onnxruntime|tokenizers|sqlite' -Quiet) {
            Write-Error "forbidden dynamic library linked (ORT/libtokenizers/libsqlite)"
            exit 1
          }
          Write-Output "OK: no ORT / libtokenizers / libsqlite dynamic link"
