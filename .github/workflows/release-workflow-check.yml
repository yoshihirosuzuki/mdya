# Guards against drift between `dist-workspace.toml` and the cargo-dist-generated
# `release.yml`.
#
# `release.yml` is generated by cargo-dist from `dist-workspace.toml`. Editing
# the generated file directly without updating `dist-workspace.toml` makes
# `dist generate --check` fail in the tag-triggered `plan` job at release time,
# which aborts the release before any GitHub Release is produced. Because
# `pr-run-mode = "skip"` keeps the full release pipeline off pull requests, this
# job runs only that consistency check per PR, so the drift surfaces as a red PR
# instead of at `git push --tags`.
#
# Dependabot's action-version bumps edit `release.yml` on purpose, so that each
# action stays at one version across all workflows (see
# `.github/dependabot.yml`). This job fails on such a PR until a commit on it
# mirrors the bump into `[dist.github-action-commits]` in `dist-workspace.toml`.
# For any other edit, the fix is to mirror it into `dist-workspace.toml` and
# re-run `dist generate`.
#
# `.github/workflows/actions.lock` pins every action to a commit. Run
# `gh actions-lock` after changing any `uses:`.

name: release-workflow-check

on:
  pull_request:
    paths:
      - 'dist-workspace.toml'
      - 'Cargo.toml'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-workflow-check.yml'
  push:
    branches: [main]
    paths:
      - 'dist-workspace.toml'
      - 'Cargo.toml'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-workflow-check.yml'

# Same group/cancel policy as ci.yml: a re-push to a PR cancels its own earlier
# run; pushes to main cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default; this workflow only reads the repository.
permissions:
  contents: read

jobs:
  dist-generate-check:
    name: release workflows up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      # `dist generate --check` runs `cargo metadata`, so it needs cargo. No
      # toolchain action is set up: the ubuntu-latest runner ships rustup, and
      # the repo's rust-toolchain.toml (channel 1.95.0) makes the first cargo
      # call auto-install the pinned toolchain. No build runs, so protoc is not
      # required here.
      - name: Install dist
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh

      # Fails if `release.yml` no longer matches what dist would generate from
      # `dist-workspace.toml`. Does not write any file. `publish-crates-io.yml`
      # is a hand-authored custom job and is intentionally not compared.
      - name: Check release.yml matches dist-workspace.toml
        run: dist generate --check
