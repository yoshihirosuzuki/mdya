# Reusable workflow that publishes the `mdya` crate to crates.io. It is invoked
# by dist's release pipeline via the `publish-jobs` entry in
# dist-workspace.toml, so it runs only on a tagged release alongside the
# prebuilt-binary build.
#
# Auth uses crates.io Trusted Publishing (OIDC): the job exchanges its GitHub
# OIDC identity for a short-lived crates.io token, so no long-lived
# CARGO_REGISTRY_TOKEN secret is stored in the repo. The trusted publisher
# (this repo + this workflow file name) must be registered once on crates.io;
# until then the token request fails.

name: Publish to crates.io

on:
  workflow_call:
    inputs:
      # dist passes its release plan (dist-manifest JSON) to every custom job.
      # It is unused here but must be declared to satisfy the calling contract.
      plan:
        required: true
        type: string

jobs:
  crates-io-publish:
    runs-on: ubuntu-latest
    permissions:
      # Mint the OIDC token consumed by crates.io Trusted Publishing.
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1

      # `@stable` is a branch of the action; `actions.lock` pins it to a
      # commit, and `gh actions-lock --relock` moves the pin forward. The Rust
      # toolchain itself comes from `rust-toolchain.toml`.
      - uses: dtolnay/rust-toolchain@stable

      # `lance-encoding`'s build script invokes `protoc` during the publish
      # verify build; the runner does not ship it.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Authenticate to crates.io (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1.0.6

      # `--locked` publishes against the committed Cargo.lock. The xtask
      # workspace members are `publish = false`, so only `mdya` is published.
      - name: cargo publish
        run: cargo publish -p mdya --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
