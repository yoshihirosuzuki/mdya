# Cross-platform PR-time smoke gate.
#
# Each runner does `cargo check --workspace` only — no link step, no test,
# no release build. This catches OS-specific compile errors (Windows path
# quirks, arch-dependent code) at PR time without paying the cold-cache
# cost of a release build. `release.yml` handles the cargo-dist release
# build; `verify.yml` is the pre-release 5-platform link verification with
# the dynamic-link invariant check.
#
# `ubuntu-latest` is intentionally excluded — `ci.yml` already runs the
# full lint + test suite on that platform, so this workflow covers only
# the additional OS / arch combinations.
#
# `lance-encoding` invokes `protoc` from its build script, so it must be
# present even for `cargo check`.
#
# `.github/workflows/actions.lock` pins every action to a commit. Run
# `gh actions-lock` after changing any `uses:`.

name: cross-platform-smoke

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Cargo settings for every step. Incremental compilation only adds artifacts
# that no later run reuses, and colors keep Cargo's output readable in the log.
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04-arm
          - windows-latest
          - macos-latest
          - macos-15-intel
    steps:
      - uses: actions/checkout@v7.0.1

      # `rust-toolchain.toml` names the toolchain; with no argument,
      # `rustup toolchain install` installs it. The runner images come with
      # rustup.
      - name: Install the Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install protoc -y

      - name: cargo check --workspace
        run: cargo check --workspace
