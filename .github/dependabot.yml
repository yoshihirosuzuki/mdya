# Dependabot configuration for mdya.
#
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # The three `candle-*` crates must move together: a single-crate bump
      # leaves two versions of `candle_core::Tensor` in the dep graph and
      # the mdya embedding modules that cross the boundary fail to compile.
      # Group them so dependabot ships one PR per candle release.
      candle:
        patterns:
          - "candle-*"
      # `lancedb` pins the whole `lance-*` family at an exact version, so a
      # single-crate bump leaves two `lance_index::scalar::FullTextSearchQuery`
      # types in the tree and `full_text_search` fails to typecheck. Group them
      # so a matching pair lands as one PR. No `update-types` filter: dependabot
      # reads lancedb 0.37 -> 0.38 as semver-minor and lance-index 10 -> 11 as
      # semver-major, so a level filter would split them apart again. Grouping
      # is not a guarantee: the two are not published at the same moment and the
      # default 3-day per-dependency cooldown can leave only one of them in a
      # weekly run. A group PR carrying one crate must not be merged: it fails
      # CI on every platform.
      lance:
        patterns:
          - "lance*"
    ignore:
      # arrow must track lancedb's arrow version (currently 58). A standalone
      # arrow major bump pulls a second arrow into the tree and breaks the
      # types that cross the lancedb boundary, so it can never merge on its
      # own. Lift this once lancedb upgrades its arrow and bump arrow by hand.
      - dependency-name: "arrow-*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    exclude-paths:
      # release.yml is generated by cargo-dist (`dist generate`) and its
      # action pins are owned by cargo-dist (pinned in dist-workspace.toml
      # `[dist.github-action-commits]`). Dependabot edits to them diverge
      # from the generated content and fail the release-workflow-check gate.
      - ".github/workflows/release.yml"
