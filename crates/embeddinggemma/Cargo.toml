[package]
name = "embeddinggemma"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "On-device EmbeddingGemma (Gemma3 bidirectional encoder) sentence embeddings on candle"

[dependencies]
candle-core = { version = "=0.10.2", default-features = false }
candle-nn = { version = "=0.10.1", default-features = false }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[features]
metal = ["candle-core/metal", "candle-nn/metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]
